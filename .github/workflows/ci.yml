name: CI

# One run per change: pushes to main, and pull requests to main (no second run for the PR branch's push).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 10 # a hanging test fails the job instead of running for hours
    strategy:
      fail-fast: false
      matrix:
        # Draft pull requests test on Ubuntu only; ready ones and main on all three systems, so a merge is
        # always checked on Windows and macOS too.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # enough to compare: a pull request's merge commit with its base, or a squash commit on main
      # main's ruleset requires a pull request and all four checks (test on each system, private-data). A change to only docs and text files (*.md, *.txt) passes these checks without testing, so a
      # docs pull request with auto-merge (gh pr merge --auto --squash) lands within seconds. Any other file runs it all.
      - id: changes
        shell: bash
        run: |
          # A missing base (e.g. a multi-commit push) fails the check below, so everything runs.
          base=${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          if git cat-file -e "$base^{commit}" 2>/dev/null && ! git diff --name-only "$base" HEAD | grep -qvE '\.(md|txt)$'; then
            echo "docs-only change: tests skipped"; echo "docs=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.docs != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.changes.outputs.docs != 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # tests do not start the desktop app
      - if: steps.changes.outputs.docs != 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.docs != 'true'
        run: npm test

  private-data:
    # The repository is public: fail on local absolute user paths or personal emails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: |
          paths='[A-Za-z]:[\\/]+Users[\\/]+[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/'
          emails='[A-Za-z0-9._%+-]+@(gmail|outlook|hotmail|yahoo|icloud|proton|gmx|web)\.[a-z]+'
          if git grep -nIE "$paths|$emails" -- . ':!app/package-lock.json'; then
            echo "::error::Private data found (see lines above). Use placeholders such as <project-path>."
            exit 1
          fi
